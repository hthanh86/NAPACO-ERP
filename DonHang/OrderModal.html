<script>	
document.addEventListener('DOMContentLoaded', function() {	
try {	
// 1. Nhận chuỗi Base64 từ Backend (Tuyệt đối an toàn trước ký tự đặc biệt)	
const base64Data = '<?= initialDataJson ?>';	
if (!base64Data) {	
console.warn("Dữ liệu khởi tạo rỗng.");	
return;	
}	
	
// 2. Giải mã Base64 sang chuỗi JSON UTF-8	
const decodedString = decodeURIComponent(escape(window.atob(base64Data)));	
const parsedData = JSON.parse(decodedString);	
console.log("Dữ liệu bóc tách từ Sheet TAO DON:", parsedData);	
initOrderModal(parsedData);	
} catch (error) {	
console.error("Lỗi quá trình khởi tạo Modal:", error);	
}	
});	
</script>
