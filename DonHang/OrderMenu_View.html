<style>
  body.oms-shell {
    --oms-sidebar-width: 224px;
    display: grid;
    grid-template-columns: var(--oms-sidebar-width) minmax(0, 1fr);
    min-height: 100vh;
    margin: 0;
    padding: 0;
    background: #f4f6fa;
  }

  .oms-sidebar {
    position: sticky;
    top: 0;
    z-index: 50;
    align-self: start;
    min-width: 0;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    padding: 20px 14px;
    background: #101b30;
    color: #e4eaf4;
    font: 500 14px system-ui, sans-serif;
  }

  .oms-sidebar *, .oms-sidebar *::before { box-sizing: border-box; }
  .oms-sidebar-top, .oms-identity { display: flex; align-items: center; gap: 10px; }
  .oms-sidebar-top { justify-content: space-between; margin: 0 3px 24px; }
  .oms-brand-mark {
    display: grid;
    place-items: center;
    flex: 0 0 35px;
    height: 35px;
    border-radius: 9px;
    background: #2663dd;
    color: #fff;
    font-size: 18px;
    font-weight: 750;
  }
  .oms-brand-name { display: block; color: #fff; font-size: 15px; font-weight: 750; }
  .oms-brand-caption { display: block; margin-top: 2px; color: #a9b8ce; font-size: 11px; }
  .oms-nav-group + .oms-nav-group { margin-top: 23px; }
  .oms-nav-label {
    margin: 0 10px 7px;
    color: #a9b8ce;
    font-size: 10px;
    font-weight: 750;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .oms-sidebar .oms-module-link {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 38px;
    margin: 3px 0;
    padding: 7px 10px;
    border: 0;
    border-radius: 7px;
    color: #e4eaf4;
    text-decoration: none;
  }
  .oms-module-icon { flex: 0 0 19px; color: #a9b8ce; text-align: center; }
  .oms-sidebar a.oms-module-link:hover { background: #213352; }
  .oms-sidebar a[aria-current="page"] { background: #244d9a; color: #fff; font-weight: 700; }
  .oms-sidebar a[aria-current="page"] .oms-module-icon { color: #fff; }
  .oms-sidebar [aria-disabled="true"] { color: #a9b8ce; }
  .oms-module-pending {
    margin-left: auto;
    color: #b8c6da;
    font-size: 9px;
    white-space: nowrap;
  }
  .oms-menu-toggle {
    display: none;
    border: 1px solid #526481;
    border-radius: 7px;
    padding: 7px 10px;
    background: transparent;
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  .oms-sidebar a:focus-visible, .oms-menu-toggle:focus-visible {
    outline: 2px solid #a6c8ff;
    outline-offset: 2px;
  }

  @media (max-width: 860px) {
    body.oms-shell { grid-template-columns: minmax(0, 1fr); }
    .oms-sidebar { height: auto; max-height: 65vh; padding: 10px 15px; }
    .oms-sidebar-top { margin: 0; }
    .oms-menu-toggle { display: block; }
    .oms-module-menu { display: none; padding-top: 15px; }
    .oms-sidebar[data-menu-open] .oms-module-menu { display: block; }
  }
</style>
<aside class="oms-sidebar" id="omsSidebar">
  <div class="oms-sidebar-top">
    <div class="oms-identity">
      <span class="oms-brand-mark" aria-hidden="true">N</span>
      <div>
        <span class="oms-brand-name">NAPACO OMS</span>
        <span class="oms-brand-caption">Điều hành sản xuất</span>
      </div>
    </div>
    <button type="button" class="oms-menu-toggle" id="omsMenuToggle"
      aria-expanded="false" aria-controls="omsModuleMenu">☰ Menu</button>
  </div>
  <nav class="oms-module-menu" id="omsModuleMenu" aria-label="Phân hệ">
    <? const groups = [...new Set(links.map(function(link) { return link.group; }))]; ?>
    <? groups.forEach(function(group) { ?>
      <div class="oms-nav-group">
        <div class="oms-nav-label"><?= group ?></div>
        <? links.filter(function(link) { return link.group === group; }).forEach(function(link) { ?>
          <? if (link.url) { ?>
            <a class="oms-module-link" href="<?= link.url ?>" <? if (link.id === activeModule) { ?>aria-current="page"<? } ?>>
              <span class="oms-module-icon" aria-hidden="true"><?= link.icon ?></span>
              <span><?= link.label ?></span>
            </a>
          <? } else { ?>
            <span class="oms-module-link" aria-disabled="true" title="Chưa cấu hình đường dẫn">
              <span class="oms-module-icon" aria-hidden="true"><?= link.icon ?></span>
              <span><?= link.label ?></span>
              <span class="oms-module-pending">Chờ liên kết</span>
            </span>
          <? } ?>
        <? }); ?>
      </div>
    <? }); ?>
  </nav>
</aside>
<script>
  (() => {
    const sidebar = document.getElementById('omsSidebar');
    const toggle = document.getElementById('omsMenuToggle');
    toggle.addEventListener('click', () => {
      const open = sidebar.toggleAttribute('data-menu-open');
      toggle.setAttribute('aria-expanded', String(open));
    });
    sidebar.addEventListener('keydown', event => {
      if (event.key === 'Escape' && sidebar.hasAttribute('data-menu-open')) {
        sidebar.removeAttribute('data-menu-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.focus();
      }
    });
  })();
</script>
