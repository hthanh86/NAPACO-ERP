<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>NAPACO ERP - Đặt Màng</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 14px 'Segoe UI', Roboto, -apple-system, Arial, sans-serif; color: #0f172a; }
    main { min-width: 0; padding: 20px; }
    h1, h2 { margin: 0; color: #1e3a5f; }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; }
    .toolbar, .fields { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .toolbar h1, .toolbar h2 { margin-right: auto; align-self: center; }
    .panel { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; }
    .table-scroll { overflow: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
    th { background: #eff6ff; color: #1e40af; white-space: nowrap; }
    tr:hover td { background: #f8fafc; }
    .fields label { display: grid; gap: 4px; }
    input, select, button { font: inherit; padding: 6px 8px; border-radius: 5px; border: 1px solid #cbd5e1; background: #fff; color: inherit; }
    input:focus, select:focus, button:focus-visible { outline: 2px solid #93c5fd; }
    button { cursor: pointer; white-space: nowrap; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }
    button:disabled { opacity: .55; cursor: default; }
    .grid input, .grid select { width: 100%; min-width: 78px; }
    .grid .size { min-width: 112px; }
    .grid .note { min-width: 120px; }
    .grid .priced { background: #fef9c3; }
    .muted { color: #475569; }
    .notice { background: #fffbeb; color: #92400e; padding: 9px; border-radius: 5px; }
    #message:empty, #setup:empty { display: none; }
    .error { color: #991b1b; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip { border-radius: 12px; background: #eaf1fc; color: #1e40af; padding: 5px 9px; }
    .choices { max-height: 190px; overflow: auto; margin-top: 5px; }
    .choices label { display: block; padding: 4px; }
    .choices input { width: auto; min-width: 0; }
    summary { cursor: pointer; color: #1e40af; }
    details > input { margin-top: 5px; }
    tfoot td { border: 0; padding-top: 12px; font-weight: 700; }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="erp-shell">
  <?!= renderOrderMenu_(appUrl, 'film') ?>
  <main>
    <div class="toolbar">
      <h1>Đặt Màng</h1>
      <button type="button" id="reload">Tải lại</button>
      <button type="button" id="create" class="primary" disabled>+ Tạo đơn đặt</button>
    </div>
    <p id="message" role="status"></p>
    <p id="setup" class="notice"></p>
    <section id="list" class="panel">
      <div id="counts" class="chips"></div>
      <div class="fields">
        <label>Tìm đơn hoặc mã vật liệu<input id="search" type="search" placeholder="PO, DN, VL, phiếu kho"></label>
        <label>Nhà cung cấp<select id="supplierFilter"></select></label>
        <label>Tiến độ<select id="progressFilter"></select></label>
        <label>Từ ngày<input type="date" id="dateFrom"></label>
        <label>Đến ngày<input type="date" id="dateTo"></label>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Nhà cung cấp</th><th>Quy cách</th><th>Đặt (kg)</th><th>Nhận (kg)</th><th>Tiến độ</th><th>Thao tác</th></tr></thead>
          <tbody id="orders"></tbody>
        </table>
      </div>
    </section>
    <form id="editor" class="panel" hidden>
      <fieldset id="editorFields" style="border:0;padding:0;margin:0;min-width:0">
        <div class="toolbar">
          <h2 id="editorTitle"></h2>
          <button type="button" id="close">Về danh sách</button>
        </div>
        <div class="fields">
          <label>Ngày đặt<input id="orderDate" type="date" required></label>
          <label>Nhà cung cấp<select id="supplier" required></select></label>
          <label>Ghi chú chung<input id="orderNote"></label>
        </div>
        <div class="table-scroll">
          <table class="grid">
            <thead><tr><th>Loại nhựa</th><th>Quy cách dày × khổ</th><th>Cấp độ</th><th>Màu sắc</th><th>Tĩnh điện</th><th>Đặt (kg)</th><th>Đơn giá</th><th>Ngày giao dự kiến</th><th>Ghi chú</th><th>Đã nhận</th><th></th></tr></thead>
            <tbody id="lines"></tbody>
            <tfoot><tr><td colspan="11" id="total"></td></tr></tfoot>
          </table>
        </div>
        <datalist id="resinTypes"><option>PET</option><option>PP</option><option>PS</option><option>PVC</option><option>PE</option><option>HIPS</option></datalist>
        <datalist id="sizes"></datalist>
        <div class="toolbar">
          <button type="button" id="add">+ Thêm quy cách</button>
          <button type="submit" id="save" class="primary">Lưu đơn</button>
        </div>
      </fieldset>
    </form>
  </main>
<script>
  const $ = id => document.getElementById(id);
  const statuses = ['Chờ giao', 'Nhận một phần', 'Đã nhận đủ', 'Hủy', 'Chưa rõ'];
  const esd = [['', 'Thường'], ['10^6-10^9', '10^6-10^9'], ['10^9-10^11', '10^9-10^11']];
  const number = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 3 });
  let data;
  let materialOptions;
  let current;
  let lineForms = [];
  let token;
  let busy = false;
  let readOnly = false;

  function node(tag, text) {
    const el = document.createElement(tag);
    if (text != null) el.textContent = text;
    return el;
  }

  function options(select, items) {
    select.replaceChildren(...items.map(([id, name]) => new Option(name, id)));
  }

  function message(value, error = false) {
    $('message').textContent = value;
    $('message').classList.toggle('error', error);
  }

  function setBusy(value) {
    busy = value;
    $('reload').disabled = value;
    $('create').disabled = value || !data || !!data.setup.length;
    $('editorFields').disabled = value;
  }

  function load(successMessage) {
    setBusy(true);
    message('Đang tải dữ liệu…');
    google.script.run.withFailureHandler(error => {
      data = null;
      $('orders').replaceChildren();
      $('counts').replaceChildren();
      setBusy(false);
      message(error.message, true);
    }).withSuccessHandler(result => {
      data = result;
      const supplier = $('supplierFilter').value;
      const suppliers = new Map(data.suppliers.map(row => [row.Ma_NCC, row.Ten_NCC]));
      data.orders.forEach(order => {
        if (order.Ma_NCC && !suppliers.has(order.Ma_NCC)) suppliers.set(order.Ma_NCC, order.Ma_NCC);
      });
      options($('supplierFilter'), [['', 'Tất cả'], ...suppliers]);
      if (suppliers.has(supplier)) $('supplierFilter').value = supplier;
      $('setup').textContent = [data.setup.length ? 'Chỉ tra cứu. ' + data.setup.join(' ') : '',
        data.receiptWarning].filter(Boolean).join(' ');
      setBusy(false);
      message(successMessage || '');
      showList();
    }).getFilmOrders();
  }

  function kg(value) {
    return value == null ? '—' : number.format(value);
  }

  function showList() {
    $('editor').hidden = true;
    $('list').hidden = false;
    if (!data) return;
    const search = $('search').value.trim().toLowerCase();
    const supplier = $('supplierFilter').value;
    const status = $('progressFilter').value;
    const from = $('dateFrom').value;
    const to = $('dateTo').value;
    const filtered = data.orders.filter(order => {
      const terms = [order.PO_NVL_ID, ...order.lines.flatMap(line => [line.DN_ID, line.VL_ID, ...line.receiptIds])];
      return (!supplier || order.Ma_NCC === supplier) && (!status || order.progress === status) &&
        (!from || order.Ngay_Dat >= from) && (!to || (order.Ngay_Dat && order.Ngay_Dat <= to)) &&
        terms.some(term => String(term).toLowerCase().includes(search));
    });
    const counts = [['Tổng đơn', filtered.length], ...statuses.map(status =>
      [status, filtered.filter(order => order.progress === status).length])];
    $('counts').replaceChildren(...counts.filter(([, count], i) => count || !i).map(([label, count]) => {
      const chip = node('span', label + ' · ' + count);
      chip.className = 'chip';
      return chip;
    }));
    $('orders').replaceChildren();
    for (const order of filtered) {
      const row = node('tr');
      const supplierName = data.suppliers.find(item => item.Ma_NCC === order.Ma_NCC);
      const cells = [order.PO_NVL_ID + (order.legacy ? ' · Dòng cũ' : ''), order.Ngay_Dat,
        supplierName ? supplierName.Ten_NCC : order.Ma_NCC, order.lines.length,
        kg(order.ordered), kg(order.received), order.progress];
      row.append(...cells.map(value => node('td', value)));
      const action = node('td');
      const edit = !order.legacy && !data.setup.length && !data.receiptWarning && order.Trang_Thai !== 'Hủy';
      const button = node('button', edit ? 'Xem / Sửa' : 'Xem');
      button.type = 'button';
      button.onclick = () => openEditor(order, !edit);
      action.append(button);
      row.append(action);
      $('orders').append(row);
    }
    if (!filtered.length) {
      const cell = node('td', 'Không có đơn phù hợp.');
      cell.colSpan = 8;
      const row = node('tr');
      row.append(cell);
      $('orders').append(row);
    }
  }

  function openEditor(order, viewOnly = false) {
    current = order;
    readOnly = viewOnly;
    token = crypto.randomUUID();
    lineForms = [];
    $('lines').replaceChildren();
    const suppliers = data.suppliers.map(row => [row.Ma_NCC, row.Ma_NCC + ' · ' + row.Ten_NCC]);
    if (order && order.Ma_NCC && !suppliers.some(([id]) => id === order.Ma_NCC)) {
      suppliers.push([order.Ma_NCC, order.Ma_NCC]);
    }
    options($('supplier'), [['', 'Chọn nhà cung cấp'], ...suppliers]);
    $('supplier').value = order ? order.Ma_NCC || '' : '';
    $('orderDate').value = order ? order.Ngay_Dat || '' : data.today;
    $('orderNote').value = order ? order.Ghi_Chu || '' : '';
    [$('supplier'), $('orderDate'), $('orderNote')].forEach(el => { el.disabled = readOnly; });
    $('editorTitle').textContent = order ? order.PO_NVL_ID +
      (order.Nguoi_Dat ? ' · ' + order.Nguoi_Dat : '') : 'Tạo đơn đặt màng';
    $('add').hidden = readOnly;
    $('save').hidden = readOnly;
    $('list').hidden = true;
    $('editor').hidden = false;
    materialOptions = new Map(data.materials.filter(row => row['Độ Dày'] && row['Khổ Nhựa'])
      .map(row => [row['Độ Dày'] + '*' + row['Khổ Nhựa'] + ' · ' + row.VL_ID, row]));
    $('sizes').replaceChildren(...Array.from(materialOptions, ([value, row]) =>
      new Option([row['Cấp Độ'], row['Màu Sắc'], row['Tĩnh Điện']].filter(Boolean).join(' · '), value)));
    if (order) order.lines.forEach(addLine);
    else addLine();
    updateTotal();
    message('');
    $('close').focus();
  }

  function priceValue(value) {
    const amount = value.trim().replace(',', '.');
    return /^\d+(?:\.\d+)?k$/i.test(amount) ? String(Number(amount.slice(0, -1)) * 1000) : amount;
  }

  function updateTotal() {
    let sum = 0;
    let cost = 0;
    let priced = false;
    for (const { fields } of lineForms) {
      const qty = Number(fields.qty.value) || 0;
      const price = priceValue(fields.price.value);
      sum += qty;
      cost += qty * (Number(price) || 0);
      priced ||= price !== '';
    }
    $('total').textContent = 'Tổng đặt ' + kg(sum) + ' kg' +
      (priced ? ' · Thành tiền các dòng có giá ' + kg(cost) + ' đ' : '');
  }

  function addLine(line = {}) {
    const row = node('tr');
    const spec = line.material || {};
    const fields = {};
    const assignmentRow = node('tr');
    const assigned = new Set(line.detailIds || []);
    const input = (key, label, value, type = 'text') => {
      const el = node('input');
      el.type = type;
      el.value = value == null ? '' : value;
      el.setAttribute('aria-label', label);
      el.disabled = readOnly;
      fields[key] = el;
      const cell = node('td');
      cell.append(el);
      row.append(cell);
      return el;
    };
    input('resin', 'Loại nhựa', line.Loai_Nhua).setAttribute('list', 'resinTypes');
    fields.resin.required = true;
    const size = input('size', 'Độ dày × khổ nhựa',
      spec['Độ Dày'] && spec['Khổ Nhựa'] ? spec['Độ Dày'] + ' × ' + spec['Khổ Nhựa'] : '');
    size.className = 'size';
    size.required = true;
    size.pattern = '[0-9]+([.,][0-9]+)?\\s*[*xX×]\\s*[0-9]+([.,][0-9]+)?';
    size.setAttribute('list', 'sizes');
    input('grade', 'Cấp độ', spec['Cấp Độ']);
    input('color', 'Màu sắc', spec['Màu Sắc']);
    const esdSelect = node('select');
    const oldEsd = spec['Tĩnh Điện'] || '';
    options(esdSelect, esd.some(([id]) => id === oldEsd) ? esd : [...esd, [oldEsd, oldEsd]]);
    esdSelect.value = oldEsd;
    esdSelect.disabled = readOnly;
    esdSelect.setAttribute('aria-label', 'Tĩnh điện');
    fields.esd = esdSelect;
    const esdCell = node('td');
    esdCell.append(esdSelect);
    row.append(esdCell);
    size.oninput = () => {
      const selected = materialOptions.get(size.value);
      if (!selected) return;
      size.value = selected['Độ Dày'] + ' × ' + selected['Khổ Nhựa'];
      fields.grade.value = selected['Cấp Độ'];
      fields.color.value = selected['Màu Sắc'];
      if (esd.some(([id]) => id === selected['Tĩnh Điện'])) esdSelect.value = selected['Tĩnh Điện'];
    };
    size.onchange = size.oninput;
    const qty = input('qty', 'Số lượng (kg)', line.So_Luong, 'number');
    qty.step = 'any';
    qty.min = '0';
    qty.required = true;
    qty.oninput = updateTotal;
    const price = input('price', 'Đơn giá (đ/kg)', line.Don_Gia);
    price.inputMode = 'decimal';
    price.pattern = '[0-9]+([.,][0-9]+)?[kK]?';
    price.placeholder = 'VD 59.5k';
    price.classList.toggle('priced', !!price.value);
    price.oninput = () => {
      price.classList.toggle('priced', !!price.value);
      updateTotal();
    };
    price.onchange = () => { price.value = priceValue(price.value); };
    input('delivery', 'Ngày giao dự kiến', line.Ngay_Giao_Du_Kien, 'date');
    input('note', 'Ghi chú dòng', line.Ghi_Chu).className = 'note';
    const received = node('td', line.DN_ID ? kg(line.received) + ' kg' : '—');
    for (const id of line.receiptIds || []) received.append(node('div', id));
    const removeCell = node('td');
    const item = { id: line.DN_ID || '', row, assignmentRow, fields, assigned };
    if (!readOnly && !line.DN_ID) {
      const remove = node('button', 'Bỏ');
      remove.type = 'button';
      remove.onclick = () => {
        row.remove();
        assignmentRow.remove();
        lineForms = lineForms.filter(entry => entry !== item);
        lineForms.forEach(entry => entry.refreshChoices());
        updateTotal();
      };
      removeCell.append(remove);
    }
    row.append(received, removeCell);

    const cell = node('td');
    cell.colSpan = 11;
    const details = node('details');
    const summary = node('summary');
    const renderSummary = () => {
      summary.textContent = [line.DN_ID, line.VL_ID, assigned.size ? 'Gán ' + assigned.size + ' CTDH' :
        'Đặt tồn kho'].filter(Boolean).join(' · ');
    };
    renderSummary();
    const search = node('input');
    search.type = 'search';
    search.placeholder = 'Tìm mã chi tiết, đơn hoặc sản phẩm';
    search.setAttribute('aria-label', 'Tìm chi tiết đơn hàng');
    const choices = node('div');
    choices.className = 'choices';
    const renderChoices = () => {
      const term = search.value.trim().toLowerCase();
      const ownLineIds = new Set(current ? current.lines.map(entry => entry.DN_ID) : []);
      const matching = data.details.filter(entry => {
        if (assigned.has(entry.ID_Chi_Tiet)) return true;
        if (readOnly || entry.Trang_Thai !== 'Chờ sản xuất' ||
            (entry.DN_ID && !ownLineIds.has(entry.DN_ID)) ||
            lineForms.some(other => other !== item && other.assigned.has(entry.ID_Chi_Tiet))) return false;
        return [entry.ID_Chi_Tiet, entry.ID_DonHang, entry.Ma_SP].join(' ').toLowerCase().includes(term);
      });
      const selected = matching.filter(entry => assigned.has(entry.ID_Chi_Tiet));
      const suggestions = matching.filter(entry => !assigned.has(entry.ID_Chi_Tiet));
      choices.replaceChildren();
      for (const entry of [...selected, ...suggestions.slice(0, 50)]) {
        const label = node('label');
        const check = node('input');
        check.type = 'checkbox';
        check.checked = assigned.has(entry.ID_Chi_Tiet);
        check.disabled = readOnly || entry.Trang_Thai !== 'Chờ sản xuất';
        check.onchange = () => {
          if (check.checked) assigned.add(entry.ID_Chi_Tiet);
          else assigned.delete(entry.ID_Chi_Tiet);
          lineForms.forEach(entry => { if (entry !== item) entry.refreshChoices(); });
          renderSummary();
        };
        label.append(check, [entry.ID_Chi_Tiet, entry.ID_DonHang, entry.Ma_SP,
          entry.So_Luong_Dat, entry.Ngay_Giao].filter(Boolean).join(' · '));
        choices.append(label);
      }
      if (!matching.length) choices.append(node('span', 'Không có CTDH phù hợp.'));
      if (suggestions.length > 50) choices.append(node('div', 'Nhập thêm ký tự để thu hẹp kết quả.'));
    };
    item.refreshChoices = () => { if (details.open) renderChoices(); };
    details.ontoggle = item.refreshChoices;
    search.oninput = renderChoices;
    details.append(summary);
    if (!readOnly) details.append(search);
    details.append(choices);
    cell.append(details);
    assignmentRow.append(cell);
    lineForms.push(item);
    $('lines').append(row, assignmentRow);
    updateTotal();
  }

  $('editor').onsubmit = event => {
    event.preventDefault();
    if (busy || readOnly) return;
    if (!lineForms.length) return message('Thêm ít nhất một quy cách.', true);
    const lines = lineForms.map(item => {
      const fields = Object.fromEntries(Object.entries(item.fields).map(([key, input]) => [key, input.value]));
      const [thickness, width] = fields.size.split(/[*x×]/i);
      return { ...fields, price: priceValue(fields.price), thickness, width, id: item.id,
        detailIds: Array.from(item.assigned) };
    });
    setBusy(true);
    message('Đang lưu đơn…');
    google.script.run.withFailureHandler(error => {
      setBusy(false);
      message(error.message, true);
    }).withSuccessHandler(result => load('Đã lưu ' + result.id + '.')).saveFilmOrder({
      id: current ? current.PO_NVL_ID : '', revision: current ? current.revision : '', token,
      supplier: $('supplier').value, date: $('orderDate').value, note: $('orderNote').value, lines
    });
  };
  $('reload').onclick = () => load();
  $('create').onclick = () => openEditor(null);
  $('close').onclick = () => { message(''); showList(); };
  $('add').onclick = () => {
    if (lineForms.length < 99) addLine();
    else message('Mỗi đơn tối đa 99 dòng quy cách.', true);
  };
  $('editor').addEventListener('keydown', event => {
    if (event.key === 'F9' && !busy && !readOnly) {
      event.preventDefault();
      $('editor').requestSubmit();
    }
  });
  options($('progressFilter'), [['', 'Tất cả'], ...statuses.map(status => [status, status])]);
  ['search', 'supplierFilter', 'progressFilter', 'dateFrom', 'dateTo'].forEach(id => {
    $(id).oninput = () => { if (!$('list').hidden) showList(); };
  });
  load();
</script>
</body>
</html>
