<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>NAPACO ERP - Đặt Màng</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 14px 'Segoe UI', Roboto, -apple-system, Arial, sans-serif; color: #0f172a; }
    main { min-width: 0; padding: 20px; }
    h1, h2 { margin: 0; color: #1e3a5f; }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; }
    .toolbar, .fields { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .toolbar h1, .toolbar h2 { margin-right: auto; align-self: center; }
    .panel { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; }
    .table-scroll { overflow: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
    th { background: #eff6ff; color: #1e40af; white-space: nowrap; }
    tr:hover td { background: #f8fafc; }
    .fields label { display: grid; gap: 4px; }
    .fields .order-note { width: min(100%, 360px); }
    input, select, textarea, button { font: inherit; padding: 6px 8px; border-radius: 5px; border: 1px solid #cbd5e1; background: #fff; color: inherit; }
    input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid #93c5fd; }
    button { cursor: pointer; white-space: nowrap; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }
    button:disabled { opacity: .55; cursor: default; }
    .grid input, .grid select { width: 100%; min-width: 78px; }
    .grid .size { min-width: 112px; }
    .grid .note { width: 100%; min-width: 220px; resize: vertical; }
    .line-orders { margin: 6px 0; }
    .line-orders input[type="search"] { width: min(100%, 540px); }
    .grid .priced { background: #fef9c3; }
    .muted { color: #475569; }
    .notice { background: #fffbeb; color: #92400e; padding: 9px; border-radius: 5px; }
    #message:empty, #setup:empty { display: none; }
    .error { color: #991b1b; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip { border-radius: 12px; background: #eaf1fc; color: #1e40af; padding: 5px 9px; }
    .choices { max-height: 190px; overflow: auto; margin-top: 5px; }
    .choices label { display: block; padding: 4px; }
    .choices input { width: auto; min-width: 0; }
    summary { cursor: pointer; color: #1e40af; }
    details > input { margin-top: 5px; }
    tfoot td { border: 0; padding-top: 12px; font-weight: 700; }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="erp-shell">
  <?!= renderOrderMenu_(appUrl, 'film') ?>
  <main>
    <div class="toolbar">
      <h1>Đặt Màng</h1>
      <button type="button" id="reload">Tải lại</button>
      <button type="button" id="create" class="primary" hidden disabled>+ Tạo đơn đặt</button>
    </div>
    <p id="message" role="status"></p>
    <p id="setup" class="notice"></p>
    <section id="list" class="panel">
      <div id="counts" class="chips"></div>
      <div class="fields">
        <label>Tìm đơn hoặc mã vật liệu<input id="search" type="search" placeholder="PO, DN, VL, phiếu kho"></label>
        <label>Nhà cung cấp<select id="supplierFilter"></select></label>
        <label>Tiến độ<select id="progressFilter"></select></label>
        <label>Từ ngày<input type="date" id="dateFrom"></label>
        <label>Đến ngày<input type="date" id="dateTo"></label>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Nhà cung cấp</th><th>Quy cách</th><th>Đặt (kg)</th><th>Nhận (kg)</th><th>Tiến độ</th><th>Thao tác</th></tr></thead>
          <tbody id="orders"></tbody>
        </table>
      </div>
    </section>
    <form id="editor" class="panel" hidden>
      <fieldset id="editorFields" style="border:0;padding:0;margin:0;min-width:0">
        <div class="toolbar">
          <h2 id="editorTitle"></h2>
          <button type="button" id="close">Về danh sách</button>
        </div>
        <div class="fields">
          <label>Ngày đặt<input id="orderDate" type="date" required></label>
          <label>Nhà cung cấp<select id="supplier" required></select></label>
          <label class="order-note">Ghi chú chung<input id="orderNote"></label>
        </div>
        <div class="table-scroll">
          <table class="grid">
            <thead><tr><th>Loại nhựa</th><th>Cấp độ</th><th>Màu sắc</th><th>Tĩnh điện</th><th>Quy cách</th><th>Đơn giá</th><th>Số lượng (kg)</th><th>Ghi chú</th><th>Ngày giao</th><th>Đã nhận / Còn lại</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody id="lines"></tbody>
            <tfoot><tr><td colspan="12" id="total"></td></tr></tfoot>
          </table>
        </div>
        <datalist id="resinTypes"><option>PET</option><option>PP</option><option>PS</option><option>PVC</option><option>PE</option><option>HIPS</option></datalist>
        <datalist id="sizes"></datalist>
        <div class="toolbar">
          <button type="button" id="add">+ Thêm quy cách</button>
          <button type="submit" id="save" class="primary">Lưu đơn</button>
        </div>
      </fieldset>
    </form>
  </main>
<script>
  const $ = id => document.getElementById(id);
  const statuses = ['Chờ giao', 'Nhận một phần', 'Đã nhận đủ', 'Hủy', 'Chưa rõ'];
  const esd = [['', ''], ['10^6-10^9', '10^6-10^9'], ['10^9-10^11', '10^9-10^11']];
  const grades = ['NS', 'A+', '90%', 'A', 'A2', 'B'];
  const quantityFormat = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 20 });
  const number = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 3 });
  let data;
  let materialOptions;
  let materialColors = [];
  let defaultDelivery;
  let newAssignmentChoices = null;
  let current;
  let lineForms = [];
  let token;
  let busy = false;
  let readOnly = false;

  function node(tag, text) {
    const el = document.createElement(tag);
    if (text != null) el.textContent = text;
    return el;
  }

  function options(select, items) {
    select.replaceChildren(...items.map(([id, name]) => new Option(name, id)));
  }

  function message(value, error = false) {
    $('message').textContent = value;
    $('message').classList.toggle('error', error);
  }

  function setBusy(value) {
    busy = value;
    $('reload').disabled = value;
    const canCreate = data?.permissions.create === true;
    $('create').hidden = !canCreate;
    $('create').disabled = value || !canCreate || !!data.setup.length;
    $('editorFields').disabled = value;
    for (const button of $('orders').querySelectorAll('button')) button.disabled = value;
  }

  function load(successMessage) {
    setBusy(true);
    message('Đang tải dữ liệu…');
    google.script.run.withFailureHandler(error => {
      data = null;
      $('orders').replaceChildren();
      $('counts').replaceChildren();
      setBusy(false);
      message(error.message, true);
    }).withSuccessHandler(result => {
      data = result;
      const { po: poColumns, supplier: supplierColumns } = data.fields;
      const supplier = $('supplierFilter').value;
      const suppliers = new Map(data.suppliers.map(row => [row[supplierColumns.ID], row[supplierColumns.NAME]]));
      data.orders.forEach(order => {
        if (order[poColumns.SUPPLIER] && !suppliers.has(order[poColumns.SUPPLIER])) suppliers.set(order[poColumns.SUPPLIER], order[poColumns.SUPPLIER]);
      });
      options($('supplierFilter'), [['', 'Tất cả'], ...suppliers]);
      if (suppliers.has(supplier)) $('supplierFilter').value = supplier;
      $('setup').textContent = [data.setup.length ? 'Chỉ tra cứu. ' + data.setup.join(' ') : '',
        data.receiptWarning].filter(Boolean).join(' ');
      setBusy(false);
      message(successMessage || '');
      showList();
    }).getFilmOrders();
  }

  function kg(value) {
    return value == null ? '—' : number.format(value);
  }

  function showList() {
    newAssignmentChoices = null;
    $('editor').hidden = true;
    $('list').hidden = false;
    if (!data) return;
    const { po: poColumns, line: lineColumns, supplier: supplierColumns } = data.fields;
    const search = $('search').value.trim().toLowerCase();
    const supplier = $('supplierFilter').value;
    const status = $('progressFilter').value;
    const from = $('dateFrom').value;
    const to = $('dateTo').value;
    const filtered = data.orders.filter(order => {
      const terms = [order[poColumns.ID], ...order.lines.flatMap(line => [line[lineColumns.ID], line[lineColumns.MATERIAL_ID], ...line.receiptIds])];
      return (!supplier || order[poColumns.SUPPLIER] === supplier) && (!status || order.progress === status) &&
        (!from || order[poColumns.DATE] >= from) && (!to || (order[poColumns.DATE] && order[poColumns.DATE] <= to)) &&
        terms.some(term => String(term).toLowerCase().includes(search));
    });
    const counts = [['Tổng đơn', filtered.length], ...statuses.map(status =>
      [status, filtered.filter(order => order.progress === status).length])];
    $('counts').replaceChildren(...counts.filter(([, count], i) => count || !i).map(([label, count]) => {
      const chip = node('span', label + ' · ' + count);
      chip.className = 'chip';
      return chip;
    }));
    $('orders').replaceChildren();
    for (const order of filtered) {
      const row = node('tr');
      const supplierName = data.suppliers.find(item => item[supplierColumns.ID] === order[poColumns.SUPPLIER]);
      const cells = [order[poColumns.ID] + (order.legacy ? ' · Dòng cũ' : ''), order[poColumns.DATE],
        supplierName ? supplierName[supplierColumns.NAME] : order[poColumns.SUPPLIER], order.lines.length,
        kg(order.ordered), kg(order.received), order.progress];
      row.append(...cells.map(value => node('td', value)));
      const action = node('td');
      const edit = data.permissions.edit === true && !order.legacy && !data.setup.length &&
        data.canEditWithReceipts && order[poColumns.STATUS] !== 'Hủy';
      const button = node('button', edit ? 'Xem / Sửa' : 'Xem');
      button.type = 'button';
      button.onclick = () => loadEditor(order, !edit);
      action.append(button);
      row.append(action);
      $('orders').append(row);
    }
    if (!filtered.length) {
      const cell = node('td', 'Không có đơn phù hợp.');
      cell.colSpan = 8;
      const row = node('tr');
      row.append(cell);
      $('orders').append(row);
    }
  }

  function detailLabel(entry) {
    const day = /^\d{4}-\d{2}-\d{2}$/.test(entry.delivery)
      ? entry.delivery.split('-').reverse().join('/') : entry.delivery;
    return [entry.id, entry.customer || '—', entry.product || '—',
      entry.qty && Number.isFinite(Number(entry.qty)) ? kg(Number(entry.qty)) : entry.qty || '—',
      day || '—'].join(' | ');
  }

  function assignmentPicker(container, entries, selected, available, onChange) {
    const search = node('input');
    search.type = 'search';
    search.placeholder = 'Tìm mã CTDH, tên khách hàng hoặc sản phẩm';
    search.setAttribute('aria-label', 'Tìm chi tiết đơn hàng');
    const choices = node('div');
    choices.className = 'choices';
    const render = () => {
      const term = search.value.trim().toLowerCase();
      const chosen = entries.filter(entry => selected.has(entry.id));
      const matches = entries.filter(entry => !selected.has(entry.id) && available(entry) &&
        detailLabel(entry).toLowerCase().includes(term));
      choices.replaceChildren();
      for (const entry of [...chosen, ...matches.slice(0, 50)]) {
        const label = node('label');
        const check = node('input');
        check.type = 'checkbox';
        check.checked = selected.has(entry.id);
        check.disabled = !entry.editable;
        check.onchange = () => {
          if (check.checked) selected.add(entry.id);
          else selected.delete(entry.id);
          onChange();
        };
        label.append(check, detailLabel(entry));
        choices.append(label);
      }
      if (!chosen.length && !matches.length) choices.append(node('span', 'Không có CTDH phù hợp.'));
      if (matches.length > 50) choices.append(node('div', 'Nhập thêm ký tự để thu hẹp kết quả.'));
    };
    search.oninput = render;
    container.append(search, choices);
    return render;
  }

  function loadEditor(order, viewOnly) {
    const { line: lineColumns } = data.fields;
    if (busy) return;
    const ids = order ? order.lines.filter(line => line.hasAssignmentColumn).map(line => line[lineColumns.ID]) : null;
    setBusy(true);
    message('Đang tải dữ liệu form…');
    google.script.run.withFailureHandler(error => {
      setBusy(false);
      message(error.message, true);
    }).withSuccessHandler(result => {
      materialColors = result.colors;
      const delivery = new Date(result.today + 'T00:00:00Z');
      delivery.setUTCDate(delivery.getUTCDate() + 3);
      defaultDelivery = delivery.toISOString().slice(0, 10);
      setBusy(false);
      openEditor(order, viewOnly, new Map(result.assignments || []));
    }).getFilmOrderFormData(ids, true);
  }

  function openEditor(order, viewOnly = false, assignments = new Map()) {
    const { po: poColumns, line: lineColumns, supplier: supplierColumns, material: materialColumns } = data.fields;
    current = order;
    readOnly = viewOnly;
    token = crypto.randomUUID();
    lineForms = [];
    $('lines').replaceChildren();
    const suppliers = data.suppliers.map(row => [row[supplierColumns.ID], row[supplierColumns.ID] + ' · ' + row[supplierColumns.NAME]]);
    if (order && order[poColumns.SUPPLIER] && !suppliers.some(([id]) => id === order[poColumns.SUPPLIER])) {
      suppliers.push([order[poColumns.SUPPLIER], order[poColumns.SUPPLIER]]);
    }
    options($('supplier'), [['', 'Chọn nhà cung cấp'], ...suppliers]);
    $('supplier').value = order ? order[poColumns.SUPPLIER] || '' : '';
    $('orderDate').value = order ? order[poColumns.DATE] || '' : data.today;
    $('orderNote').value = order ? order[poColumns.NOTE] || '' : '';
    [$('supplier'), $('orderDate'), $('orderNote')].forEach(el => { el.disabled = readOnly; });
    $('editorTitle').textContent = order ? order[poColumns.ID] +
      (order[poColumns.USER] ? ' · ' + order[poColumns.USER] : '') : 'Tạo đơn đặt màng';
    $('add').hidden = readOnly;
    $('save').hidden = readOnly;
    $('list').hidden = true;
    $('editor').hidden = false;
    materialOptions = new Map(data.materials.filter(row => row[materialColumns.THICKNESS] && row[materialColumns.WIDTH])
      .map(row => [row[materialColumns.THICKNESS] + '*' + row[materialColumns.WIDTH] + ' · ' + row[materialColumns.ID], row]));
    $('sizes').replaceChildren(...Array.from(materialOptions, ([value, row]) =>
      new Option([row[materialColumns.GRADE], row[materialColumns.COLOR], row[materialColumns.ESD]].filter(Boolean).join(' · '), value)));
    if (order) order.lines.forEach(line => addLine(line, assignments.get(line[lineColumns.ID])));
    else addLine();
    updateTotal();
    message('');
    $('close').focus();
  }

  function priceValue(value) {
    const text = value.trim();
    if (!text) return '';
    const shorthand = /^(\d+(?:[.,]\d+)?)k$/i.exec(text);
    return shorthand ? Number(shorthand[1].replace(',', '.')) * 1000 : quantityValue(text);
  }

  function quantityValue(value) {
    const text = value.trim();
    if (/^\d{1,3}(?:\.\d{3})+(?:,\d+)?$/.test(text)) {
      return Number(text.replaceAll('.', '').replace(',', '.'));
    }
    return /^\d+(?:[.,]\d+)?$/.test(text) ? Number(text.replace(',', '.')) : NaN;
  }

  function updateTotal() {
    let sum = 0;
    let cost = 0;
    let priced = false;
    for (const { fields } of lineForms) {
      const qty = quantityValue(fields.qty.value) || 0;
      const price = priceValue(fields.price.value);
      sum += qty;
      cost += qty * (Number(price) || 0);
      priced ||= price !== '';
    }
    $('total').textContent = 'Tổng đặt ' + kg(sum) + ' kg' +
      (priced ? ' · Thành tiền các dòng có giá ' + kg(cost) + ' đ' : '');
  }

  function addLine(line = {}, assignedEntries = []) {
    const { line: lineColumns, material: materialColumns } = data.fields;
    const row = node('tr');
    const spec = line.material || {};
    const fields = {};
    const assignmentRow = node('tr');
    const originalIds = assignedEntries.map(entry => entry.id);
    const assigned = new Set(originalIds);
    const input = (key, label, value, type = 'text') => {
      const el = node(type === 'textarea' || type === 'select' ? type : 'input');
      if (el.tagName === 'INPUT') el.type = type;
      el.value = value == null ? '' : value;
      el.setAttribute('aria-label', label);
      el.disabled = readOnly;
      fields[key] = el;
      const cell = node('td');
      cell.append(el);
      row.append(cell);
      return el;
    };
    input('resin', 'Loại nhựa', line[lineColumns.RESIN]).setAttribute('list', 'resinTypes');
    fields.resin.required = true;
    const grade = input('grade', 'Cấp độ', '', 'select');
    const oldGrade = spec[materialColumns.GRADE] || '';
    const gradeValues = ['', ...grades];
    if (!gradeValues.includes(oldGrade)) gradeValues.push(oldGrade);
    options(grade, gradeValues.map(value => [value, value || '—']));
    grade.value = oldGrade;
    const color = input('color', 'Màu sắc', '', 'select');
    function setColor(value) {
      const colors = value && !materialColors.includes(value) ? [...materialColors, value] : materialColors;
      options(color, colors.map(name => [name, name]));
      color.value = value || '';
    }
    setColor(spec[materialColumns.COLOR]);
    const esdSelect = input('esd', 'Tĩnh điện', '', 'select');
    const oldEsd = spec[materialColumns.ESD] || '';
    options(esdSelect, esd.some(([id]) => id === oldEsd) ? esd : [...esd, [oldEsd, oldEsd]]);
    esdSelect.value = oldEsd;
    const size = input('size', 'Quy cách',
      spec[materialColumns.THICKNESS] && spec[materialColumns.WIDTH] ? spec[materialColumns.THICKNESS] + ' × ' + spec[materialColumns.WIDTH] : '');
    size.className = 'size';
    size.required = true;
    size.pattern = '[0-9]+([.,][0-9]+)?\\s*[*xX×]\\s*[0-9]+([.,][0-9]+)?';
    size.setAttribute('list', 'sizes');
    size.oninput = () => {
      const selected = materialOptions.get(size.value);
      if (!selected) return;
      size.value = selected[materialColumns.THICKNESS] + ' × ' + selected[materialColumns.WIDTH];
      if (gradeValues.includes(selected[materialColumns.GRADE])) grade.value = selected[materialColumns.GRADE];
      setColor(selected[materialColumns.COLOR]);
      if (esd.some(([id]) => id === selected[materialColumns.ESD])) esdSelect.value = selected[materialColumns.ESD];
    };
    size.onchange = size.oninput;
    const price = input('price', 'Đơn giá (đ/kg)', line[lineColumns.PRICE] ? quantityFormat.format(line[lineColumns.PRICE]) : '');
    price.inputMode = 'decimal';
    price.placeholder = 'VD 59.500';
    price.classList.toggle('priced', !!price.value);
    price.oninput = () => {
      const value = priceValue(price.value);
      price.setCustomValidity(value === '' || Number.isFinite(value)
        ? '' : 'Nhập đơn giá hợp lệ.');
      price.classList.toggle('priced', !!price.value);
      updateTotal();
    };
    price.onblur = () => {
      const value = priceValue(price.value);
      if (Number.isFinite(value)) price.value = quantityFormat.format(value);
    };
    const qty = input('qty', 'Số lượng (kg)', line[lineColumns.QTY] ? quantityFormat.format(line[lineColumns.QTY]) : '');
    qty.inputMode = 'decimal';
    qty.required = true;
    qty.placeholder = 'VD 1.250,5';
    qty.oninput = () => {
      qty.setCustomValidity(quantityValue(qty.value) > 0 ? '' : 'Nhập số lượng lớn hơn 0.');
      updateTotal();
    };
    qty.onblur = () => {
      const value = quantityValue(qty.value);
      if (Number.isFinite(value)) qty.value = quantityFormat.format(value);
    };
    const note = input('note', 'Ghi chú dòng', line[lineColumns.NOTE], 'textarea');
    note.className = 'note';
    note.rows = 2;
    input('delivery', 'Ngày giao', line[lineColumns.ID] ? line[lineColumns.DELIVERY] : defaultDelivery, 'date');
    const received = node('td');
    function updateReceived() {
      if (line.received == null) {
        received.textContent = '—';
        return;
      }
      const difference = (quantityValue(qty.value) || 0) - line.received;
      received.replaceChildren(node('div', 'Đã nhận ' + kg(line.received) + ' KG'),
        node('div', difference < -1e-8 ? 'Dư ' + kg(-difference) + ' KG'
          : 'Còn lại ' + kg(Math.max(0, difference)) + ' KG'));
      for (const id of line.receiptIds || []) received.append(node('div', id));
    }
    qty.addEventListener('input', updateReceived);
    updateReceived();
    row.append(received);
    const status = input('status', 'Trạng thái nhận', '', 'select');
    const currentStatus = line[lineColumns.STATUS] || data.lineStatuses[0];
    const choices = data.lineStatuses.includes(currentStatus) ? data.lineStatuses : [currentStatus, ...data.lineStatuses];
    options(status, choices.map(value => [value, value]));
    status.value = currentStatus;
    status.disabled = readOnly || !line[lineColumns.ID] || currentStatus === 'Hủy';
    const removeCell = node('td');
    const item = { id: line[lineColumns.ID] || '', row, assignmentRow, fields, assigned, originalIds };
    if (!readOnly && !line[lineColumns.ID]) {
      const remove = node('button', 'Bỏ');
      remove.type = 'button';
      remove.onclick = () => {
        row.remove();
        assignmentRow.remove();
        lineForms = lineForms.filter(entry => entry !== item);
        lineForms.forEach(entry => entry.refreshChoices());
        updateTotal();
      };
      removeCell.append(remove);
    }
    row.append(removeCell);

    const cell = node('td');
    cell.colSpan = 12;
    const details = node('details');
    details.append(node('summary', 'Xem Đơn'));
    item.refreshChoices = () => {};
    const content = node('div', 'Chưa gán đơn.');
    content.className = 'line-orders';
    details.append(content);

    function showDraftPicker(entries) {
      content.replaceChildren();
      const render = assignmentPicker(content, entries, assigned,
        entry => !lineForms.some(other => other !== item && other.assigned.has(entry.id)),
        () => {
          lineForms.forEach(other => { if (other !== item) other.refreshChoices(); });
        });
      item.refreshChoices = () => { if (details.open) render(); };
      details.ontoggle = item.refreshChoices;
      item.refreshChoices();
    }

    function loadDetails(edit) {
      if (edit && !item.id && newAssignmentChoices) {
        showDraftPicker(newAssignmentChoices);
        return;
      }
      const status = node('div', 'Đang tải CTDH…');
      status.setAttribute('role', 'status');
      content.replaceChildren(status);
      const runner = google.script.run.withFailureHandler(error => {
        if (!status.isConnected) return;
        status.textContent = error.message;
        const retry = node('button', 'Thử lại');
        retry.type = 'button';
        retry.onclick = () => loadDetails(edit);
        content.append(retry);
      }).withSuccessHandler(entries => {
        if (!status.isConnected) return;
        if (edit) {
          if (!item.id) newAssignmentChoices = entries;
          // Keep the original snapshot for the server's concurrent-edit check.
          showDraftPicker(entries.filter(entry => !entry.assigned || assigned.has(entry.id)));
        } else {
          content.replaceChildren(...entries.map(entry => node('div', detailLabel(entry))));
          if (!entries.length) content.append(node('div', 'Chưa gán đơn.'));
        }
      });
      if (edit) runner.getFilmAssignmentOptions(item.id);
      else runner.getFilmAssignedDetails(item.id);
    }

    const canAssign = !readOnly && data.permissions.assign === true && (!item.id || line.canAssign);
    if (canAssign) {
      const edit = node('button', 'Sửa/Bổ sung');
      edit.type = 'button';
      edit.onclick = () => loadDetails(true);
      details.append(edit);
    }
    if (item.id && line.hasAssignmentColumn) {
      details.ontoggle = () => {
        if (!details.open) return;
        details.ontoggle = null;
        if (assignedEntries.length) loadDetails(false);
      };
    } else if (!canAssign) {
      details.hidden = true;
    }
    cell.append(details);
    assignmentRow.append(cell);
    lineForms.push(item);
    $('lines').append(row, assignmentRow);
    updateTotal();
  }

  $('editor').onsubmit = event => {
    event.preventDefault();
    if (busy || readOnly) return;
    if (!lineForms.length) return message('Thêm ít nhất một quy cách.', true);
    const lines = lineForms.map(item => {
      const fields = Object.fromEntries(Object.entries(item.fields).map(([key, input]) => [key, input.value]));
      const [thickness, width] = fields.size.split(/[*x×]/i);
      const changed = item.assigned.size !== item.originalIds.length ||
        item.originalIds.some(id => !item.assigned.has(id));
      return { ...fields, qty: quantityValue(fields.qty), price: priceValue(fields.price), thickness, width, id: item.id,
        ...((!item.id || changed) && { detailIds: Array.from(item.assigned), originalIds: item.originalIds }) };
    });
    setBusy(true);
    message('Đang lưu đơn…');
    google.script.run.withFailureHandler(error => {
      setBusy(false);
      message(error.message, true);
    }).withSuccessHandler(result => load('Đã lưu ' + result.id + '.')).saveFilmOrder({
      id: current ? current[data.fields.po.ID] : '', revision: current ? current.revision : '', token,
      supplier: $('supplier').value, date: $('orderDate').value, note: $('orderNote').value, lines
    });
  };
  $('reload').onclick = () => load();
  $('create').onclick = () => loadEditor(null, false);
  $('close').onclick = () => { message(''); showList(); };
  $('add').onclick = () => {
    if (lineForms.length < 99) addLine();
    else message('Mỗi đơn tối đa 99 dòng quy cách.', true);
  };
  $('editor').addEventListener('keydown', event => {
    if (event.key === 'F9' && !busy && !readOnly) {
      event.preventDefault();
      $('editor').requestSubmit();
    }
  });
  options($('progressFilter'), [['', 'Tất cả'], ...statuses.map(status => [status, status])]);
  ['search', 'supplierFilter', 'progressFilter', 'dateFrom', 'dateTo'].forEach(id => {
    $(id).oninput = () => { if (!$('list').hidden) showList(); };
  });
  load();
</script>
</body>
</html>
